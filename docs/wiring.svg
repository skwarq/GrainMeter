<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>GrainMeter – schemat podłączenia FireBeetle 2 ESP32-C6 (DFR1075) i sondy STW-100</title>
  <style>
    :root { --bg:#ffffff; --fg:#1d2329; --muted:#5b6670; --board:#f1f6f0; --board-edge:#2f6b3a;
            --pin:#d9e3d6; --used:#ffd9a8; --box:#f6f3ee; --edge:#6b6257; --warn:#b3261e; --warnbg:#fdeceb;
            --gnd:#1f5fbf; --data:#c62828; --vcc:#222222; --nc:#2e8b57; --opt:#7b6fa8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9aa5b1; --board:#12241a; --board-edge:#5fb070;
              --pin:#24362a; --used:#5a4120; --box:#1b1f24; --edge:#8b949e; --warn:#ff8a80; --warnbg:#3a1714;
              --gnd:#6ea8ff; --data:#ff6b6b; --vcc:#d0d7de; --nc:#5fd39b; --opt:#b4a7e6; }
    }
    .bg { fill: var(--bg); }
    text { fill: var(--fg); }
    .muted { fill: var(--muted); font-size: 11.5px; }
    .title { font-size: 17px; font-weight: 700; }
    .h { font-weight: 700; }
    .board { fill: var(--board); stroke: var(--board-edge); stroke-width: 2; }
    .pin { fill: var(--pin); stroke: var(--board-edge); stroke-width: 1; }
    .pin-used { fill: var(--used); stroke: var(--board-edge); stroke-width: 1.4; }
    .box { fill: var(--box); stroke: var(--edge); stroke-width: 1.5; }
    .sym { fill: none; stroke: var(--fg); stroke-width: 1.6; }
    .symfill { fill: var(--fg); }
    .w { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .gnd { stroke: var(--gnd); }
    .data { stroke: var(--data); }
    .vcc { stroke: var(--vcc); }
    .nc { stroke: var(--nc); stroke-dasharray: 4 4; }
    .thin { fill: none; stroke: var(--fg); stroke-width: 1.6; }
    .opt { fill: none; stroke: var(--opt); stroke-width: 1.6; stroke-dasharray: 5 4; }
    .opttext { fill: var(--opt); font-size: 11.5px; }
    .dot { fill: var(--fg); }
    .warnbox { fill: var(--warnbg); stroke: var(--warn); stroke-width: 1.5; }
    .warn { fill: var(--warn); font-weight: 700; }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="660" rx="10"/>
  <text class="title" x="24" y="34">GrainMeter – podłączenie sondy STW-100, przycisku i zasilania</text>
  <text class="muted" x="24" y="54">FireBeetle 2 ESP32-C6 (DFR1075), złącze P1 widziane od strony elementów · numeracja pinów wg schematu DFRobot V1.0/V1.1</text>

  <!-- ===== Solar panel ===== -->
  <rect class="box" x="24" y="78" width="170" height="44" rx="6"/>
  <text class="h" x="36" y="97">Panel słoneczny 5 V</text>
  <text class="muted" x="36" y="113">+ → VCC (P1-1),  − → GND</text>
  <path class="w vcc" d="M194 92 H560" stroke-dasharray="0"/>
  <text class="muted" x="300" y="86">5 V (wejście ładowarki CN3165)</text>

  <!-- ===== Probe socket ===== -->
  <rect class="box" x="24" y="160" width="176" height="166" rx="8"/>
  <text class="h" x="36" y="181">Gniazdo Hirschmann</text>
  <text class="h" x="36" y="197">CA 3 GD (sonda STW-100)</text>
  <circle class="sym" cx="62" cy="248" r="34"/>
  <circle class="symfill" cx="50" cy="234" r="4"/><text x="38" y="230" font-size="10">3</text>
  <circle class="symfill" cx="74" cy="234" r="4"/><text x="80" y="230" font-size="10">1</text>
  <circle class="symfill" cx="50" cy="262" r="4"/><text x="38" y="276" font-size="10">2</text>
  <circle class="symfill" cx="74" cy="262" r="4"/><text x="80" y="276" font-size="10">4</text>
  <text x="112" y="216" font-size="12">3 czarny</text>
  <text x="112" y="244" font-size="12">1 niebieski</text>
  <text x="112" y="272" font-size="12">2 czerwony</text>
  <text x="112" y="297" font-size="12">4 zielony</text>
  <text class="muted" x="30" y="318" font-size="10.5">układ pinów w gnieździe poglądowy</text>

  <!-- probe wires -->
  <path class="w vcc" d="M200 212 H270 V118 H560"/>
  <path class="w gnd" d="M200 240 H310 V144 H560"/>
  <path class="w data" d="M200 268 H560"/>
  <path class="w nc" d="M200 294 H222"/>
  <path class="thin" d="M218 290 L226 298 M226 290 L218 298"/>
  <text class="muted" x="230" y="298">NC</text>

  <text class="muted" x="318" y="112">VCC sondy → 3V3</text>
  <text class="muted" x="318" y="160">GND</text>

  <!-- optional series resistor + TVS on DATA -->
  <rect x="300" y="258" width="56" height="20" rx="3" class="opt" style="fill:var(--bg)"/>
  <text class="opttext" x="306" y="290">100 Ω</text>
  <path class="opt" d="M268 268 V316"/>
  <path class="opt" d="M258 316 H278 L268 332 Z"/>
  <path class="opt" d="M258 332 H278"/>
  <path class="opt" d="M268 332 V346"/>
  <path class="sym" d="M256 346 H280 M260 351 H276 M264 356 H272" stroke="var(--opt)"/>
  <text class="opttext" x="200" y="372">TVS/ESD 3,3 V (opcja)</text>
  <circle class="dot" cx="268" cy="268" r="3.5"/>

  <!-- pull-up 4.7k on DATA -->
  <circle class="dot" cx="420" cy="268" r="3.5"/>
  <path class="thin" d="M420 268 V252"/>
  <rect x="410" y="206" width="20" height="46" rx="3" class="thin" style="fill:var(--bg)"/>
  <path class="thin" d="M420 206 V192"/>
  <rect x="402" y="174" width="36" height="18" rx="4" class="thin" style="fill:var(--bg)"/>
  <text class="h" x="407" y="188" font-size="12">3V3</text>
  <text x="436" y="226" class="h">4,7 kΩ</text>
  <text class="muted" x="436" y="242">pull-up DATA</text>

  <!-- service button on GPIO2 -->
  <path class="thin" d="M560 296 H470"/>
  <circle class="dot" cx="470" cy="296" r="3.5"/>
  <path class="thin" d="M470 296 V352"/>
  <!-- switch symbol -->
  <circle class="sym" cx="470" cy="356" r="3"/>
  <circle class="sym" cx="470" cy="396" r="3"/>
  <path class="thin" d="M470 359 L488 390"/>
  <path class="thin" d="M470 399 V412"/>
  <path class="sym" d="M458 412 H482 M462 417 H478 M466 422 H474"/>
  <text class="h" x="458" y="372" text-anchor="end">Przycisk</text>
  <text class="muted" x="458" y="388" text-anchor="end">serwisowy, do GND</text>
  <!-- 10k pull-up to the left -->
  <path class="thin" d="M470 296 H452"/>
  <rect x="396" y="286" width="56" height="20" rx="3" class="thin" style="fill:var(--bg)"/>
  <path class="thin" d="M396 296 H382"/>
  <rect x="346" y="287" width="36" height="18" rx="4" class="thin" style="fill:var(--bg)"/>
  <text class="h" x="351" y="301" font-size="12">3V3</text>
  <text class="h" x="402" y="324">10 kΩ</text>

  <!-- ===== FireBeetle board ===== -->
  <rect class="board" x="560" y="70" width="316" height="460" rx="12"/>
  <text class="h" x="700" y="98">FireBeetle 2</text>
  <text class="h" x="700" y="116">ESP32-C6</text>
  <text class="muted" x="700" y="133">DFR1075</text>

  <!-- P1 header pins -->
  <g>
    <rect class="pin-used" x="556" y="84" width="16" height="16" rx="3"/><text x="580" y="97">1  VCC (5 V wej.)</text>
    <rect class="pin-used" x="556" y="110" width="16" height="16" rx="3"/><text x="580" y="123">2  3V3</text>
    <rect class="pin-used" x="556" y="136" width="16" height="16" rx="3"/><text x="580" y="149">3  GND</text>
    <rect class="pin" x="556" y="162" width="16" height="16" rx="3"/><text class="muted" x="580" y="175">4  IO20/SCL</text>
    <rect class="pin" x="556" y="188" width="16" height="16" rx="3"/><text class="muted" x="580" y="201">5  IO19/SDA</text>
    <rect class="pin" x="556" y="214" width="16" height="16" rx="3"/><text class="muted" x="580" y="227">6  IO5/LP_TX</text>
    <rect class="pin" x="556" y="236" width="16" height="16" rx="3"/><text class="muted" x="580" y="249">7  IO4/LP_RX</text>
    <rect class="pin-used" x="556" y="260" width="16" height="16" rx="3"/><text x="580" y="273" class="h">8  IO3/A2 – DATA</text>
    <rect class="pin-used" x="556" y="288" width="16" height="16" rx="3"/><text x="580" y="301" class="h">9  IO2/A1 – serwis</text>
    <rect class="pin" x="556" y="314" width="16" height="16" rx="3"/><text class="muted" x="580" y="327">10 NC</text>
    <rect class="pin" x="556" y="340" width="16" height="16" rx="3"/><text class="muted" x="580" y="353">11 IO15/BLK (LED)</text>
    <rect class="pin" x="556" y="366" width="16" height="16" rx="3"/><text class="muted" x="580" y="379">12 IO6/TCS</text>
    <rect class="pin" x="556" y="392" width="16" height="16" rx="3"/><text class="muted" x="580" y="405">13 IO7/INT</text>
    <rect class="pin" x="556" y="418" width="16" height="16" rx="3"/><text class="muted" x="580" y="431">14 NC</text>
  </g>
  <text class="h" x="760" y="160">Na płytce</text>
  <text class="muted" x="760" y="178">GPIO0 ← VBAT / 2</text>
  <text class="muted" x="760" y="194">(1 MΩ + 1 MΩ)</text>
  <text class="muted" x="760" y="214">GPIO9 = BOOT</text>
  <text class="muted" x="760" y="230">GPIO15 = LED</text>
  <text class="muted" x="760" y="246">GPIO12/13 = USB</text>
  <text class="muted" x="760" y="262">CN3165 ładowarka</text>
  <text class="muted" x="760" y="278">max 0,5 A</text>

  <rect class="box" x="790" y="62" width="70" height="22" rx="5"/>
  <text x="799" y="78" font-size="12">USB-C</text>
  <text class="muted" x="760" y="304">USB-C: flash,</text>
  <text class="muted" x="760" y="320">konsola, zasilanie</text>

  <!-- BAT connector + battery -->
  <rect class="box" x="690" y="518" width="80" height="24" rx="5"/>
  <text x="712" y="535" font-size="12" class="h">BAT</text>
  <path class="w data" d="M712 542 V586"/>
  <path class="w vcc" d="M748 542 V586"/>
  <rect class="box" x="640" y="586" width="180" height="50" rx="8"/>
  <text class="h" x="652" y="606">Akumulator Li-ion 1S</text>
  <text class="muted" x="652" y="623">3,7 V, np. 18650 / Li-Po</text>
  <text x="700" y="580" font-size="12" class="h">+</text>
  <text x="755" y="580" font-size="12" class="h">−</text>
  <text class="muted" x="470" y="630">sprawdź polaryzację wtyku!</text>

  <!-- warning -->
  <rect class="warnbox" x="24" y="440" width="380" height="76" rx="8"/>
  <text class="warn" x="38" y="462">Nie łączyć z oryginalnym czytnikiem STW-100</text>
  <text x="38" y="481" font-size="12">Na DATA czytnika zmierzono ok. 4,95 V, a GPIO ESP32-C6</text>
  <text x="38" y="497" font-size="12">tolerują tylko 3,3 V. Próba wyłącznie z samą sondą.</text>

  <!-- legend -->
  <g transform="translate(24,540)">
    <text class="h" x="0" y="0">Legenda</text>
    <path class="w vcc" d="M0 18 H34"/><text x="42" y="22" font-size="12">VCC sondy / 5 V</text>
    <path class="w gnd" d="M0 38 H34"/><text x="42" y="42" font-size="12">GND</text>
    <path class="w data" d="M0 58 H34"/><text x="42" y="62" font-size="12">DATA 1-Wire</text>
    <path class="w nc" d="M200 18 H234"/><text x="242" y="22" font-size="12">niepodłączony</text>
    <path class="opt" d="M200 38 H234"/><text x="242" y="42" font-size="12" class="opttext">opcjonalnie (do sprawdzenia)</text>
    <circle class="dot" cx="217" cy="58" r="3.5"/><text x="242" y="62" font-size="12">połączenie (węzeł)</text>
    <rect class="pin-used" x="410" y="10" width="14" height="14" rx="3"/><text x="430" y="22" font-size="12">pin używany</text>
  </g>
</svg>
